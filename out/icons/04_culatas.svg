<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- head body -->
  <g id="head-body">
    <rect class="stroke" x="6" y="20" width="36" height="16" rx="2"/>
  </g>
  <!-- combustion chambers -->
  <g id="chambers">
    <circle class="stroke" cx="15" cy="28" r="4"/>
    <circle class="stroke" cx="24" cy="28" r="4"/>
    <circle class="stroke" cx="33" cy="28" r="4"/>
  </g>
  <!-- valve ports top -->
  <g id="ports">
    <line class="stroke" x1="12" y1="20" x2="12" y2="12"/>
    <line class="stroke" x1="18" y1="20" x2="18" y2="12"/>
    <line class="stroke" x1="21" y1="20" x2="21" y2="12"/>
    <line class="stroke" x1="27" y1="20" x2="27" y2="12"/>
    <line class="stroke" x1="30" y1="20" x2="30" y2="12"/>
    <line class="stroke" x1="36" y1="20" x2="36" y2="12"/>
    <line class="stroke" x1="8" y1="12" x2="40" y2="12"/>
  </g>
</svg>
