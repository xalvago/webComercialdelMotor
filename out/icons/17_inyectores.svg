<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- body -->
  <g id="body">
    <rect class="stroke" x="20" y="6" width="8" height="24" rx="2"/>
  </g>
  <!-- nozzle -->
  <g id="nozzle">
    <path class="stroke" d="M20 30 L22 38 L24 40 L26 38 L28 30"/>
  </g>
  <!-- electrical connector -->
  <g id="connector">
    <rect class="stroke" x="16" y="10" width="6" height="8" rx="1"/>
    <rect class="stroke" x="26" y="10" width="6" height="8" rx="1"/>
  </g>
  <!-- fuel spray -->
  <g id="spray">
    <line class="stroke" x1="21" y1="42" x2="19" y2="46"/>
    <line class="stroke" x1="24" y1="42" x2="24" y2="46"/>
    <line class="stroke" x1="27" y1="42" x2="29" y2="46"/>
  </g>
</svg>
