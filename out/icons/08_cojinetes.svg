<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- outer race -->
  <g id="outer-race">
    <circle class="stroke" cx="24" cy="24" r="16"/>
  </g>
  <!-- inner race -->
  <g id="inner-race">
    <circle class="stroke" cx="24" cy="24" r="9"/>
  </g>
  <!-- balls -->
  <g id="balls">
    <circle class="stroke" cx="24" cy="9" r="3"/>
    <circle class="stroke" cx="37" cy="16" r="3"/>
    <circle class="stroke" cx="37" cy="32" r="3"/>
    <circle class="stroke" cx="24" cy="39" r="3"/>
    <circle class="stroke" cx="11" cy="32" r="3"/>
    <circle class="stroke" cx="11" cy="16" r="3"/>
  </g>
</svg>
