<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- piston body -->
  <g id="piston-body">
    <rect class="stroke" x="16" y="22" width="16" height="12" rx="2"/>
  </g>
  <!-- rings -->
  <g id="rings">
    <line class="stroke" x1="14" y1="25" x2="16" y2="25"/>
    <line class="stroke" x1="14" y1="30" x2="16" y2="30"/>
    <line class="stroke" x1="32" y1="25" x2="34" y2="25"/>
    <line class="stroke" x1="32" y1="30" x2="34" y2="30"/>
  </g>
  <!-- crown -->
  <g id="crown">
    <path class="stroke" d="M18 22 L18 16 L20 14 L24 16 L28 14 L30 16 L30 22"/>
  </g>
  <!-- pin and rod -->
  <g id="rod">
    <line class="stroke" x1="24" y1="34" x2="24" y2="42"/>
    <circle class="stroke" cx="24" cy="42" r="3"/>
  </g>
</svg>
