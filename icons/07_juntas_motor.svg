<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- gasket outline -->
  <g id="gasket">
    <rect class="stroke" x="6" y="12" width="36" height="24" rx="2"/>
  </g>
  <!-- bolt holes -->
  <g id="bolt-holes">
    <circle class="stroke" cx="10" cy="16" r="2.5"/>
    <circle class="stroke" cx="38" cy="16" r="2.5"/>
    <circle class="stroke" cx="10" cy="32" r="2.5"/>
    <circle class="stroke" cx="38" cy="32" r="2.5"/>
    <circle class="stroke" cx="24" cy="16" r="2.5"/>
    <circle class="stroke" cx="24" cy="32" r="2.5"/>
  </g>
  <!-- combustion cutouts -->
  <g id="cutouts">
    <circle class="stroke" cx="17" cy="24" r="5"/>
    <circle class="stroke" cx="31" cy="24" r="5"/>
  </g>
</svg>
