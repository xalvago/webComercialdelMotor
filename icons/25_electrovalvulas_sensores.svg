<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- valve body -->
  <g id="valve-body">
    <rect class="stroke" x="8" y="20" width="20" height="12" rx="2"/>
  </g>
  <!-- solenoid coil -->
  <g id="coil">
    <rect class="stroke" x="10" y="12" width="16" height="10" rx="2"/>
    <line class="stroke" x1="14" y1="12" x2="14" y2="8"/>
    <line class="stroke" x1="22" y1="12" x2="22" y2="8"/>
    <line class="stroke" x1="12" y1="8" x2="24" y2="8"/>
  </g>
  <!-- flow ports -->
  <g id="ports">
    <line class="stroke" x1="4" y1="26" x2="8" y2="26"/>
    <line class="stroke" x1="28" y1="26" x2="32" y2="26"/>
  </g>
  <!-- sensor -->
  <g id="sensor">
    <rect class="stroke" x="34" y="18" width="10" height="14" rx="2"/>
    <circle class="stroke" cx="39" cy="25" r="3"/>
    <line class="stroke" x1="39" y1="18" x2="39" y2="14"/>
    <line class="stroke" x1="36" y1="14" x2="42" y2="14"/>
  </g>
</svg>
