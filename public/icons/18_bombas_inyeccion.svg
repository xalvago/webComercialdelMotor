<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <style>
    .stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .fill { fill: currentColor; stroke: none; }
  </style>
  <!-- pump body -->
  <g id="body">
    <rect class="stroke" x="10" y="14" width="24" height="22" rx="3"/>
  </g>
  <!-- plunger -->
  <g id="plunger">
    <rect class="stroke" x="18" y="6" width="8" height="10" rx="1"/>
    <line class="stroke" x1="22" y1="6" x2="22" y2="2"/>
  </g>
  <!-- cam drive -->
  <g id="cam">
    <circle class="stroke" cx="22" cy="28" r="6"/>
    <line class="stroke" x1="22" y1="22" x2="22" y2="16"/>
  </g>
  <!-- outlets -->
  <g id="outlets">
    <line class="stroke" x1="34" y1="18" x2="42" y2="18"/>
    <line class="stroke" x1="34" y1="22" x2="42" y2="22"/>
    <line class="stroke" x1="34" y1="26" x2="42" y2="26"/>
    <line class="stroke" x1="42" y1="16" x2="42" y2="28"/>
  </g>
</svg>
